services:
  samba:
    image: dperson/samba
    container_name: samba-server

    ports:
      - "445:445"
      - "139:139"
      - "137:137/udp"
      - "138:138/udp"

    volumes:
      - ./data:/data

    command: >
      -u "presiden;123"
      -s "mentri;/data/mentri;yes;no;yes"
      -s "presiden;/data/presiden;yes;no;no;presiden"

    restart: unless-stopped
